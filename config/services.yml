# DZ Carrier Manager — Service definitions
# @see https://devdocs.prestashop-project.org/9/modules/concepts/services/

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # ══════════════════════════════════════════════════════════════
    #  DATABASE
    # ══════════════════════════════════════════════════════════════

    Module\DzCarrierManager\Database\ModuleInstaller:
        public: true
        arguments:
            - '@doctrine.dbal.default_connection'
            - '%database_prefix%'

    # ══════════════════════════════════════════════════════════════
    #  CARRIER ABSTRACTION & WEBHOOKS
    # ══════════════════════════════════════════════════════════════

    Module\DzCarrierManager\Carrier\Guepex\GuepexCarrier: ~
    Module\DzCarrierManager\Carrier\Guepex\GuepexWebhookHandler: ~

    Module\DzCarrierManager\Carrier\CarrierRegistry:
        calls:
            - [register, ['@Module\DzCarrierManager\Carrier\Guepex\GuepexCarrier']]

    # ══════════════════════════════════════════════════════════════
    #  CONTROLLERS
    # ══════════════════════════════════════════════════════════════

    Module\DzCarrierManager\Controller\Admin\ParcelController:
        arguments:
            - '@doctrine.dbal.default_connection'
            - '@Module\DzCarrierManager\Carrier\CarrierRegistry'
        tags: ['controller.service_arguments']

    Module\DzCarrierManager\Controller\Admin\CarrierAccountController:
        arguments:
            - '@doctrine.dbal.default_connection'
            - '@Module\DzCarrierManager\Carrier\CarrierRegistry'
        tags: ['controller.service_arguments']

    # ══════════════════════════════════════════════════════════════
    #  GRID — Parcels
    # ══════════════════════════════════════════════════════════════

    # Grid definition factory
    prestashop.module.dzcarriermanager.grid.definition.factory.parcels:
        class: 'Module\DzCarrierManager\Grid\Definition\Factory\ParcelGridDefinitionFactory'
        parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'

    # Query builder
    Module\DzCarrierManager\Grid\Query\ParcelQueryBuilder:
        parent: 'prestashop.core.grid.abstract_query_builder'
        autowire: true
        autoconfigure: true

    # Data provider (wraps query builder into a grid data factory)
    prestashop.module.dzcarriermanager.grid.data_provider.parcels:
        class: '%prestashop.core.grid.data.factory.doctrine_grid_data_factory%'
        arguments:
            - '@Module\DzCarrierManager\Grid\Query\ParcelQueryBuilder'
            - '@prestashop.core.hook.dispatcher'
            - '@prestashop.core.grid.query.doctrine_query_parser'
            - 'dzcarriermanager_parcel'

    # Grid factory (assembles everything into a renderable Grid)
    prestashop.module.dzcarriermanager.grid.factory.parcels:
        class: 'PrestaShop\PrestaShop\Core\Grid\GridFactory'
        arguments:
            - '@prestashop.module.dzcarriermanager.grid.definition.factory.parcels'
            - '@prestashop.module.dzcarriermanager.grid.data_provider.parcels'
            - '@prestashop.core.grid.filter.form_factory'
            - '@prestashop.core.hook.dispatcher'

    # ══════════════════════════════════════════════════════════════
    #  GRID — Carrier Accounts
    # ══════════════════════════════════════════════════════════════

    # Grid definition factory
    prestashop.module.dzcarriermanager.grid.definition.factory.carrier_accounts:
        class: 'Module\DzCarrierManager\Grid\Definition\Factory\CarrierAccountGridDefinitionFactory'
        parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'

    # Query builder
    Module\DzCarrierManager\Grid\Query\CarrierAccountQueryBuilder:
        parent: 'prestashop.core.grid.abstract_query_builder'
        autowire: true
        autoconfigure: true

    # Data provider
    prestashop.module.dzcarriermanager.grid.data_provider.carrier_accounts:
        class: '%prestashop.core.grid.data.factory.doctrine_grid_data_factory%'
        arguments:
            - '@Module\DzCarrierManager\Grid\Query\CarrierAccountQueryBuilder'
            - '@prestashop.core.hook.dispatcher'
            - '@prestashop.core.grid.query.doctrine_query_parser'
            - 'dzcarriermanager_carrier_account'

    # Grid factory
    prestashop.module.dzcarriermanager.grid.factory.carrier_accounts:
        class: 'PrestaShop\PrestaShop\Core\Grid\GridFactory'
        arguments:
            - '@prestashop.module.dzcarriermanager.grid.definition.factory.carrier_accounts'
            - '@prestashop.module.dzcarriermanager.grid.data_provider.carrier_accounts'
            - '@prestashop.core.grid.filter.form_factory'
            - '@prestashop.core.hook.dispatcher'

